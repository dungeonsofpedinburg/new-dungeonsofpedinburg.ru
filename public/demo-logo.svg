<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" role="img" aria-label="Демо-логотип приключения">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe6ae"/>
      <stop offset="50%" stop-color="#e8b45c"/>
      <stop offset="100%" stop-color="#b8802f"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="none" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" filter="url(#soft)">
    <polygon points="300,26 356,58 356,122 300,154 244,122 244,58"/>
    <polygon points="300,26 300,154 M244,58 L356,122 M356,58 L244,122"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" filter="url(#soft)">
    <text x="300" y="192" font-size="34" fill="url(#gold)" letter-spacing="5">ПОДЗЕМЕЛЬЯ ПЕДИНБУРГА</text>
  </g>
</svg>
